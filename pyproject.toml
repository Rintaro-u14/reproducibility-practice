[project]
name = "reproducibility-practice"
version = "0.1.0"
description = "架空の脳波データの解析"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dvc==3.67.1",
  "matplotlib>=3.9",
  "mlflow>=3,<4",
  "numpy>=2",
  "optuna>=4",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[dependency-groups]
dev = [
  "optuna-dashboard>=0.17",
]

[tool.uv]
python-preference = "only-managed"
required-version = ">=0.11"

# cryptography（DVCが間接的に使う）は49.0から、Intel CPUのMac向けの配布物（wheel）がない。
# Intel Macでも入るように、それより前のバージョンにとどめる。
constraint-dependencies = ["cryptography<49"]
