# 解析で使う設定の値（パラメータ）。
# 値を変えて uv run dvc repro を実行すると、その値を使う段だけがやり直される。

preprocess:
  low_hz: 1.0        # 帯域通過フィルタの下限（Hz）
  high_hz: 40.0      # 帯域通過フィルタの上限（Hz）
  filter_order: 4    # フィルタの次数

features:
  epoch_s: 2.0       # 1つの試行の長さ（秒）
  edge_s: 1.0        # 区間の切り替わりの前後で使わない長さ（秒）
  max_hz: 40         # パワーを残す周波数の上限（Hz）
  reject_uv: 100     # しきい値。振幅の最大がこの値（µV）を超えた試行は、ノイズが大きいとみなして除く

summary:
  alpha_low_hz: 8    # アルファ波とみなす周波数の下限（Hz）
  alpha_high_hz: 12  # アルファ波とみなす周波数の上限（Hz）
  channels: [O1, Oz, O2]   # 後頭部のチャンネル

# モデルの設定を探索するための設定
tuning:
  n_trials: 40                  # 試す回数
  seed: 20261029                # 乱数の種。同じ種なら、同じ順番で同じ設定を試す
  test_subject: sub-03          # 探索には使わず、最後の確認だけに使う被験者
  band_low_hz: [1, 20]          # 周波数帯の下限を探す範囲（Hz）
  band_width_hz: [2, 20]        # 周波数帯の幅を探す範囲（Hz）
  regularization_c: [0.001, 100.0]   # 正則化の強さ C を探す範囲
